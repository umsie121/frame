<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connect MELCloud</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --sub:#6e6e73; --line:#d2d2d7; --blue:#0071e3; --red:#d70015; --green:#28a745; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#1c1c1e; --text:#f5f5f7; --sub:#98989d; --line:#38383a; --blue:#0a84ff; --red:#ff453a; --green:#30d158; } }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:420px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 56px) 24px 40px; }
  h1 { font:600 32px/1.1 -apple-system, "SF Pro Display", sans-serif; letter-spacing:-.02em; margin:0 0 10px; }
  p { color:var(--sub); margin:0 0 28px; }
  input { display:block; width:100%; font:inherit; padding:15px 16px; margin-bottom:12px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); }
  button { width:100%; font:inherit; font-weight:600; padding:16px; border:0; border-radius:14px; background:var(--blue); color:#fff; margin-top:6px; }
  button:disabled { opacity:.5; }
  .msg { margin-top:16px; font-size:15px; }
  .err { color:var(--red); } .ok { color:var(--green); }
  small { display:block; color:var(--sub); margin-top:28px; font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>Connect MELCloud</h1>
  <p>Sign in with your Mitsubishi Electric MELCloud account so the family frame can show and control your air conditioning.</p>
  <form id="f">
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button id="go" type="submit">Sign In</button>
  </form>
  <div id="msg" class="msg"></div>
  <small>Your phone signs in to MELCloud directly. Only a sign-in key is sent to the frame; your password is never stored or sent there.</small>
</main>
<script>
  var form = document.getElementById('f'), msg = document.getElementById('msg'), go = document.getElementById('go');
  function show(text, cls) { msg.textContent = text; msg.className = 'msg ' + (cls || ''); }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    go.disabled = true; show('Signing in…');
    fetch('https://app.melcloud.com/Mitsubishi.Wifi.Client/Login/ClientLogin', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ Email: document.getElementById('email').value.trim(), Password: document.getElementById('pw').value,
        Language: 0, AppVersion: '1.34.12.0', Persist: true, CaptchaResponse: null })
    }).then(function (r) { return r.json(); }).then(function (j) {
      document.getElementById('pw').value = '';
      if (j.ErrorId !== null || !j.LoginData) throw new Error(j.ErrorId === 1 ? 'Wrong email or password.' : 'MELCloud sign-in failed.');
      return fetch('/api/kv/melcloud', { method: 'PUT', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contextKey: j.LoginData.ContextKey }) });
    }).then(function (r) {
      if (r.status === 401) throw new Error('This link has expired. Ask for a new one.');
      if (!r.ok) throw new Error('The frame did not accept the key (' + r.status + ').');
      show('Connected. Your air conditioning will appear on the frame within a minute.', 'ok');
      form.style.display = 'none';
    }).catch(function (err) { show(err.message || String(err), 'err'); go.disabled = false; });
  });
</script>
</body>
</html>
